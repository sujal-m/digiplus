<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="digiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Modern rounded badge background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#digiGrad)" filter="url(#glow)"/>

  <!-- Subtle neural/context network nodes -->
  <circle cx="18" cy="20" r="2.5" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="46" cy="20" r="2.5" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="20" cy="46" r="2.5" fill="#ffffff" fill-opacity="0.6"/>
  <line x1="18" y1="20" x2="32" y2="30" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="2 2"/>
  <line x1="46" y1="20" x2="32" y2="30" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="2 2"/>
  <line x1="20" y1="46" x2="32" y2="30" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="2 2"/>

  <!-- "D" shape representing DigiPlus Organizational Knowledge Base -->
  <path d="M22 17 H34 C41.5 17 46 22 46 31 C46 40 41.5 45 34 45 H22 V17 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Central Context / AI Spark (+) node -->
  <path d="M42 36 V48 M36 42 H48" 
        stroke="url(#plusGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round"/>
</svg>
